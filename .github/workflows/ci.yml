name: Workflow

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name:  Test, Type-Check, Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alafia_ci
      JWT_SECRET: ci-only-jwt-secret-change-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Unit tests
        run: |
          if pnpm run | grep -qE '^[[:space:]]+test($|:)'; then
            pnpm run test
          else
            echo "No test script found; skipping unit tests."
          fi
          

      - name: Type-check
        run: pnpm run type-check

      - name: Production build
        run: pnpm run build
