name: Workflow

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test, Type-Check, Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alafia_ci
      JWT_SECRET: ci-only-jwt-secret-change-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: |
          if npm run | grep -qE '^[[:space:]]+test($|:)'; then
            npm run test
          else
            echo "No test script found; skipping unit tests."
          fi

      - name: Type-check
        run: npm run type-check

      - name: Production build
        run: npm run build
